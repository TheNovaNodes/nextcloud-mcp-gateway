[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextcloud-mcp-gateway"
version = "1.0.0"
description = "Nextcloud Data Plane MCP Server for TheNovaNodes (WebDAV, Files, Notes, CRM & User Cloud Storage)"
readme = "README.md"
authors = [{ name = "TheNovaNodes", email = "izizizwtfzalupchick@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
nextcloud-mcp-gateway = "nextcloud_mcp_gateway.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
