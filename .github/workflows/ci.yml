name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        
    - name: Verify dependencies
      run: |
        go mod download
        go mod verify
        
    - name: Go Vet
      run: |
        go vet ./...

    - name: Run Unit Tests with Race and Coverage
      run: |
        go test -v -race -cover ./internal/...

    - name: Build Binary
      run: |
        go build -v -o bin/nextcloud-mcp-gateway ./cmd/nextcloud-mcp-gateway
