name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Verify dependencies
      run: |
        go mod download
        go mod verify

    - name: Go Vet
      run: |
        go vet ./...

    - name: Run Unit Tests with Race and Coverage
      run: |
        go test -v -race -cover ./internal/...

    - name: Build Binary
      run: |
        go build -v -o bin/nextcloud-mcp-gateway ./cmd/nextcloud-mcp-gateway
